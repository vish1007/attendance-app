<!DOCTYPE html>
<html>
<head>
  <title>Attendance Management System</title>

  <style>
    /* ===== GLOBAL ===== */
    :root {
      --surface: rgba(255, 255, 255, 0.9);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --surface-muted: #f6f8fb;
      --line: rgba(148, 163, 184, 0.28);
      --text: #0f172a;
      --text-soft: #475569;
      --text-muted: #64748b;
      --primary: #0f4c81;
      --primary-strong: #0b3b67;
      --primary-soft: #e8f1fb;
      --success: #15803d;
      --success-soft: #e8f7ee;
      --danger: #b42318;
      --danger-soft: #fff1f1;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.22);
      --shadow-md: 0 16px 36px rgba(15, 23, 42, 0.16);
      --shadow-sm: 0 10px 20px rgba(15, 23, 42, 0.1);
    }

    body[data-theme="classic"] {
      --surface: rgba(255, 255, 255, 0.94);
      --surface-strong: rgba(255, 255, 255, 0.98);
      --surface-muted: #f8fafc;
      --line: rgba(203, 213, 225, 0.9);
      --text: #111827;
      --text-soft: #374151;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-strong: #1e3a8a;
      --primary-soft: #eff6ff;
      --success: #166534;
      --success-soft: #e8f8ee;
      --danger: #991b1b;
      --danger-soft: #fdecec;
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* ===== BULK ACTION BUTTONS ===== */
.attendance-box {
  width: 100%;
  flex: none;
}
.name-row {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
}
.attendance-bar {
  width: 100%;
  height: 64px;
  background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(148, 163, 184, 0.2);
}

.attendance-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #0f4c81 0%, #2f7dbd 100%);
  transition: width 0.4s ease, background 0.3s ease;
}
.attendance-text {
  position: absolute;
  inset: 0;                    /* top, right, bottom, left = 0 */
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
  font-weight: 700;
  color: var(--text);
  pointer-events: none;        /* click-through */
}

.bulk-actions {
  max-width: 900px;
  margin: 28px auto;
  display: flex;
  gap: 20px;
  justify-content: center;
}

.bulk-btn {
  flex: 1;
  padding: 16px 28px;
  font-size: 20px;
  font-weight: 700;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: var(--shadow-md);
}

/* ✅ MARK ALL PRESENT */
.present-all {
  background: linear-gradient(135deg, #0f4c81, #1d6aa8);
  color: white;
}

.present-all:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 36px rgba(15, 76, 129, 0.35);
}

/* ❌ MARK ALL ABSENT */
.absent-all {
  background: linear-gradient(135deg, #7f1d1d, #b42318);
  color: white;
}

.absent-all:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 36px rgba(180, 35, 24, 0.3);
}

/* Disabled state (optional) */
.bulk-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

    body {
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0 24px 40px;
      min-height: 100vh;
      color: var(--text);
      background-image: url("assets/bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(6, 17, 31, 0.8) 0%, rgba(10, 23, 40, 0.72) 40%, rgba(15, 23, 42, 0.82) 100%),
        radial-gradient(circle at top, rgba(59, 130, 246, 0.16), transparent 38%);
      pointer-events: none;
      z-index: 0;
    }

    body[data-theme="classic"]::before {
      background: rgba(255, 255, 255, 0.08);
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    .startup-splash {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.22), transparent 34%),
        linear-gradient(180deg, rgba(5, 16, 31, 0.98) 0%, rgba(10, 22, 39, 0.98) 100%);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .startup-splash::before,
    .startup-splash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    .startup-splash::before {
      clip-path: polygon(0 0, 100% 0, 62% 100%, 0 100%);
    }

    .startup-splash::after {
      clip-path: polygon(38% 0, 100% 0, 100% 100%, 0 100%);
    }

    .startup-splash.is-exiting::before {
      transform: translate(-26vw, -12vh) rotate(-10deg);
      opacity: 0;
    }

    .startup-splash.is-exiting::after {
      transform: translate(28vw, 14vh) rotate(10deg);
      opacity: 0;
    }

    .startup-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-brand {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      animation: splashZoomIn 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .splash-logo {
      width: min(34vw, 240px);
      max-width: 240px;
      min-width: 120px;
      filter: drop-shadow(0 24px 36px rgba(0, 0, 0, 0.32));
    }

    .splash-title {
      max-width: 560px;
      font-size: clamp(28px, 3vw, 44px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: uppercase;
    }

    .startup-splash.is-exiting .splash-brand {
      animation: splashSplitAway 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes splashZoomIn {
      from {
        opacity: 0;
        transform: scale(0.88) translateY(22px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes splashSplitAway {
      to {
        opacity: 0;
        transform: scale(1.06) rotate(-4deg) translateY(-24px);
      }
    }

    /* ===== HEADER ===== */
    .header {
      max-width: 1080px;
      margin: 28px auto 0;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 22px 28px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      border-radius: 24px;
    }

    .logo {
      height: 74px;
      margin-bottom: 12px;
      filter: drop-shadow(0 10px 18px rgba(15, 23, 42, 0.18));
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.02em;
    }

    /* ===== CONTROLS ===== */
    .controls {
      margin: 30px auto;
      max-width: 600px;
      background: var(--surface);
      padding: 34px;
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.45);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .controls label {
      display: block;
      font-size: 15px;
      margin-bottom: 10px;
      color: var(--text-soft);
      text-align: left;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .controls input {
      font-size: 17px;
      padding: 14px 16px;
      width: 100%;
      margin-bottom: 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.95);
      color: var(--text);
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .controls input:focus {
      outline: none;
      border-color: rgba(15, 76, 129, 0.44);
      box-shadow: 0 0 0 4px rgba(15, 76, 129, 0.12);
      background: #ffffff;
    }

    .theme-row {
      margin-bottom: 20px;
    }

    .theme-select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 14px 44px 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(246, 248, 251, 0.96) 100%);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      box-sizing: border-box;
      cursor: pointer;
    }

    .theme-select-wrap {
      position: relative;
    }

    .theme-select-wrap::after {
      content: "▾";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 15px;
    }

    .appearance-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 10000;
      padding: 24px;
    }

    .appearance-modal.is-open {
      display: block;
    }

    .appearance-dialog {
      width: min(620px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      margin: 24px auto;
      padding: 24px;
      border-radius: 24px;
      background: var(--surface-strong);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px);
    }

    .appearance-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .appearance-heading {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .appearance-close {
      min-width: 44px;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .customize-panel {
      display: block;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      text-align: left;
      margin: 0;
    }

    .customize-grid {
      display: grid;
      gap: 14px;
    }

    .asset-picker {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .asset-picker button {
      flex-shrink: 0;
    }

    .asset-value {
      flex: 1;
      min-height: 22px;
      color: var(--text-muted);
      font-size: 14px;
      word-break: break-all;
    }

    .customize-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .secondary-btn {
      background: linear-gradient(135deg, #64748b, #475569) !important;
      box-shadow: 0 12px 24px rgba(71, 85, 105, 0.2) !important;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .controls button {
      font-size: 17px;
      font-weight: 700;
      padding: 15px 28px;
      background: linear-gradient(135deg, var(--primary), #1d6aa8);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 16px 30px rgba(15, 76, 129, 0.25);
    }

    .controls button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 18px 34px rgba(15, 76, 129, 0.32);
    }

    .current-file {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--primary-soft);
      border: 1px solid rgba(15, 76, 129, 0.18);
      border-radius: 12px;
      color: var(--primary-strong);
      font-size: 15px;
      text-align: left;
      word-break: break-word;
      display: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .file-picker {
      position: relative;
      margin-bottom: 20px;
    }

    .file-picker-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .file-picker-trigger:hover,
    .file-picker-trigger.is-open {
      border-color: rgba(15, 76, 129, 0.3);
      box-shadow: 0 16px 32px rgba(15, 76, 129, 0.14);
      transform: translateY(-1px);
      background: linear-gradient(180deg, #ffffff 0%, #eef4fb 100%);
    }

    .file-picker-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 0;
    }

    .file-picker-label {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .file-picker-subtext {
      font-size: 13px;
      color: var(--text-muted);
    }

    .file-picker-caret {
      font-size: 20px;
      line-height: 1;
      color: var(--primary);
      font-weight: 700;
    }

    .file-picker-panel {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      right: 0;
      z-index: 30;
      padding: 16px;
      border-radius: 18px;
      background: var(--surface-strong);
      border: 1px solid rgba(15, 76, 129, 0.14);
      box-shadow: var(--shadow-lg);
      text-align: left;
      backdrop-filter: blur(18px);
    }

    .file-picker-panel.is-open {
      display: block;
    }

    .file-picker-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .file-picker-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .browse-device-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #1d6aa8);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 76, 129, 0.22);
    }

    .browse-device-btn:hover {
      background: linear-gradient(135deg, var(--primary-strong), #15527f);
    }

    .recent-files {
      margin: 0;
      max-width: none;
      text-align: left;
      display: none;
    }

    .recent-files h3 {
      margin: 0 0 12px;
      color: #1f2937;
      font-size: 20px;
    }

    .recent-file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .recent-file-item {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .recent-file-btn {
      flex: 1;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .recent-file-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 76, 129, 0.32);
      box-shadow: 0 16px 28px rgba(15, 76, 129, 0.14);
    }

    .recent-file-name {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .recent-file-path {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .recent-file-remove {
      min-width: 92px;
      padding: 0 16px;
      border: 1px solid rgba(180, 35, 24, 0.16);
      border-radius: 12px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .recent-file-remove:hover {
      background: #ffe4e4;
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(180, 35, 24, 0.12);
    }

    .recent-files-empty {
      padding: 16px;
      border: 1px dashed rgba(148, 163, 184, 0.32);
      border-radius: 12px;
      background: var(--surface-muted);
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    .search-box {
      display: none;
      max-width: 900px;
      margin: 24px auto;
      position: relative;
      z-index: 20;
    }

    .search-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 18px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(12px);
    }

    .search-box input:focus {
      outline: none;
      border-color: rgba(15, 76, 129, 0.32);
      box-shadow: 0 0 0 4px rgba(15, 76, 129, 0.12), var(--shadow-md);
    }

    /* ===== STUDENT LIST ===== */
    .students-container {
      max-width: 900px;
      margin: auto;
      padding: 12px 0 20px;
    }

    .student-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
    }

  padding: 14px 18px;
  border-radius: 16px;
  display: block;

}



   .meta {
  font-size: 17px;
  color: var(--text-soft);
  font-weight: 600;
  margin-bottom: 6px;
}

    .buttons {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
    }

    .btn.present {
      background: var(--success-soft);
      color: var(--success);
      border-color: rgba(21, 128, 61, 0.2);
    }

    .btn.absent {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: rgba(180, 35, 24, 0.16);
    }

    .btn.active.present {
      background: linear-gradient(135deg, #166534, #15803d);
      color: white;
      box-shadow: 0 14px 26px rgba(21, 128, 61, 0.2);
    }

    .btn.active.absent {
      background: linear-gradient(135deg, #7f1d1d, #b42318);
      color: white;
      box-shadow: 0 14px 26px rgba(180, 35, 24, 0.18);
    }

    /* ===== LIVE COUNTER ===== */
    .count-panel {
      position: sticky;
      top: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px auto;
      max-width: 900px;
      z-index: 10;
    }

    .count {
      font-size: 22px;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
    }

    .count.present {
      background: var(--success-soft);
      color: var(--success);
    }

    .count.absent {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .student-card.hidden {
  display: none;
}
.roll-back-btn,
.home-btn {
  position: fixed;
  top: 20px;
  z-index: 9999;
  padding: 10px 18px;
  font-size: 18px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  border-radius: 999px;
  border: none;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(12px);
}

.roll-back-btn {
  left: 20px;
}

.home-btn {
  right: 20px;
}

    @media (max-width: 768px) {
      body {
        padding: 0 14px 24px;
      }

      .header,
      .controls,
      .students-container,
      .bulk-actions,
      .search-box {
        max-width: 100%;
      }

      .header {
        padding: 20px 18px;
      }

      .title {
        font-size: 26px;
      }

      .controls {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .bulk-actions,
      .buttons,
      .recent-file-item,
      .file-picker-actions {
        flex-direction: column;
      }

      .bulk-btn,
      .recent-file-remove,
      .browse-device-btn {
        width: 100%;
      }

      .name {
        font-size: 32px;
      }
    }

    @media (max-width: 480px) {
      .roll-back-btn,
      .home-btn {
        top: 12px;
        padding: 8px 14px;
        font-size: 15px;
      }

      .roll-back-btn {
        left: 12px;
      }

      .home-btn {
        right: 12px;
      }
    }

  </style>
</head>

<body>

  <div id="startupSplash" class="startup-splash">
    <div class="splash-brand">
      <img src="assets/logo.png" class="splash-logo" id="splashLogo">
      <div class="splash-title" id="splashTitle">Attendance Management System</div>
    </div>
  </div>

  <!-- ===== HEADER ===== -->
  <div class="header">
    <img src="assets/logo.png" class="logo" id="appLogo">
    <div class="title" id="appTitle">Attendance Management System</div>
  </div>

  <!-- ===== CONTROLS ===== -->
<div id="bulkControls" class="bulk-actions" style="display:none;">
  <button id="markAllPresent" class="bulk-btn present-all">
    ✅ Mark All Present
  </button>

  <button id="markAllAbsent" class="bulk-btn absent-all">
    ❌ Mark All Absent
  </button>
</div>


  <div class="controls" id="setupControls">
    <label>Select Excel File</label>
    <input type="file" id="file" class="visually-hidden" accept=".xlsx,.xls,.csv">
    <div class="file-picker" id="filePicker">
      <button type="button" id="filePickerTrigger" class="file-picker-trigger">
        <span class="file-picker-copy">
          <span class="file-picker-label">Choose Excel File</span>
          <span class="file-picker-subtext">Browse your computer or pick a recent file</span>
        </span>
        <span class="file-picker-caret">+</span>
      </button>

      <div id="filePickerPanel" class="file-picker-panel">
        <div class="file-picker-actions">
          <div class="file-picker-title">Recent Files</div>
          <button type="button" id="browseDeviceBtn" class="browse-device-btn">Browse Device</button>
        </div>

        <div id="recentFilesSection" class="recent-files">
          <div id="recentFilesList" class="recent-file-list"></div>
        </div>
      </div>
    </div>
    <div id="currentFile" class="current-file"></div>

    <label>Select Date</label>
    <input type="date" id="date">
   
    <button id="startBtn">Start Attendance</button>
  </div>

  <!-- ===== LIVE COUNTS ===== -->
  <!-- <div class="count-panel">
    <div class="count present">
      ✅ Present: <span id="presentCount">0</span>
    </div>
    <div class="count absent">
      ❌ Absent: <span id="absentCount">0</span>
    </div>
  </div> -->

  <!-- ===== STUDENTS ===== -->
   <!-- BULK + ROLL CALL CONTROLS -->
<div id="rollCallControls" class="bulk-actions" style="display:none;">
  <button id="playRoll" class="bulk-btn present-all">
    ▶ Play Roll Call
  </button>

  \
</div>

<div class="controls search-box" id="searchBox">
  <input
    type="text"
    id="searchInput"
    autocomplete="off"
    spellcheck="false"
    placeholder="Search by Name or Application ID"
  />
</div>

  <div id="appearanceModal" class="appearance-modal">
    <div class="appearance-dialog">
      <div class="appearance-header">
        <div class="appearance-heading">App Appearance</div>
        <button type="button" id="appearanceCloseBtn" class="appearance-close secondary-btn">Close</button>
      </div>

      <div id="customizePanel" class="customize-panel">
        <div class="theme-row">
          <label for="themeSelect">App Theme</label>
          <div class="theme-select-wrap">
            <select id="themeSelect" class="theme-select">
              <option value="professional">Professional</option>
              <option value="classic">Classic</option>
            </select>
          </div>
        </div>

        <div class="customize-grid">
          <div>
            <label for="titleInput">App Name</label>
            <input type="text" id="titleInput" placeholder="Attendance Management System">
          </div>

          <div>
            <label>Logo Image</label>
            <input type="file" id="logoInput" class="visually-hidden" accept="image/*">
            <div class="asset-picker">
              <button type="button" id="chooseLogoBtn">Choose Logo</button>
              <div id="logoPathLabel" class="asset-value">Using default logo</div>
            </div>
          </div>

          <div>
            <label>Background Image</label>
            <input type="file" id="backgroundInput" class="visually-hidden" accept="image/*">
            <div class="asset-picker">
              <button type="button" id="chooseBackgroundBtn">Choose Background</button>
              <div id="backgroundPathLabel" class="asset-value">Using default background</div>
            </div>
          </div>
        </div>

        <div class="customize-actions">
          <button type="button" id="saveBrandingBtn">Save Changes</button>
          <button type="button" id="resetBrandingBtn" class="secondary-btn">Reset Default</button>
        </div>
      </div>
    </div>
  </div>

  <div class="students-container" id="students"></div>

  <script src="renderer.js"></script>
  <button id="rollBackBtn" class="roll-back-btn" style="display:none;">
  ⬅ Back
</button>
<!-- 🎙 VOICE SETTINGS MODAL -->
  <button id="homeBtn" class="home-btn" style="display:none;">
  Home
</button>
<div id="voiceSettingsModal" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  z-index:9999;
">

  <div style="
    width:360px;
    background:white;
    padding:20px;
    border-radius:16px;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  ">

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>🎙 Voice Settings</h3>
      <button id="closeVoiceSettings" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
      ">❌</button>
    </div>

    <label>⏱ Roll Delay</label>
    <select id="rollSpeed">
      <option value="2000">2 seconds</option>
      <option value="3000">3 seconds</option>
      <option value="4000" selected>4 seconds</option>
      <option value="5000">5 seconds</option>
    </select>

    <label>🔊 Volume</label>
    <input type="range" id="voiceVolume" min="0" max="1" step="0.1" value="1">

    <label>🗣 Speech Rate</label>
    <input type="range" id="voiceRate" min="0.5" max="1.5" step="0.05">

    <label>🎵 Pitch</label>
    <input type="range" id="voicePitch" min="0.5" max="2" step="0.1">

  </div>
</div>
<div style="
  position:fixed;
  bottom:10px;
  right:20px;
  font-size:13px;
  color:#555;
  opacity:0.8;
  z-index:9999;
">
  © 2026 Developed by <b>Vishal & Arjun</b>
</div>

</body>
</html>
